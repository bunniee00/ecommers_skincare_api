# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=skincare-ecommerce-api
server.port=8080

# ===================================================================
# Database Configuration (MySQL via Docker)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/skincare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skincare}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skincare123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JPA / Hibernate Properties
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# File Upload / Multipart Settings (Max 5MB)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# ===================================================================
# CORS Settings
# ===================================================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===================================================================
# Swagger / OpenAPI Documentation
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true